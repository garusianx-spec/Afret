<!doctype html>
<html lang="fa-IR" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F9" />
    <title>آفرت — آفلاین</title>
    <style>
      :root {
        --ink: #2d2b3f;
        --muted: #6b687e;
        --surface: #faf7f9;
        --card: #ffffff;
        --border: #f3e8ee;
        --deep: #913d65;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--surface);
        color: var(--ink);
        /* No next/font here — this page must render with zero JS and zero
           network, so it uses whatever Persian face the device already has. */
        font-family: 'Vazirmatn', 'IRANSans', Tahoma, system-ui, sans-serif;
      }
      .card {
        max-width: 24rem;
        width: 100%;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px 24px;
        box-shadow: 0 8px 24px -12px rgba(145, 61, 101, 0.18);
      }
      h1 { font-size: 1.125rem; margin: 16px 0 8px; }
      p { font-size: 0.875rem; line-height: 2; color: var(--muted); margin: 0 0 20px; }
      button {
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: var(--deep);
        border: 0;
        border-radius: 999px;
        padding: 12px 24px;
        cursor: pointer;
      }
      .emoji { font-size: 2.5rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="emoji" aria-hidden="true">🌙</div>
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>
        بخش‌هایی که قبلاً باز کرده‌اید همچنان در دسترس‌اند. پیام‌هایی که می‌نویسید
        ذخیره می‌شوند و به‌محض برقراری اتصال ارسال خواهند شد.
      </p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
